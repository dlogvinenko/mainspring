[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mainspring"
version = "1.0.0"
description = "Product Requirements Document (PRD)-first AI coding agent orchestration for production-grade software delivery."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
  "ai-coding-agent",
  "coding-agent",
  "agent-orchestration",
  "autonomous-coding",
  "developer-tools",
  "llm-agents",
  "prd",
  "prd-first",
  "product-requirements-document",
  "ai-code-review",
  "local-ai-agents",
  "taskmaster",
  "codex",
  "claude",
  "ollama",
  "litellm",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "rich>=13.7,<15",
]

[project.urls]
Homepage = "https://github.com/dlogvinenko/mainspring"
Source = "https://github.com/dlogvinenko/mainspring"
Documentation = "https://github.com/dlogvinenko/mainspring/blob/main/docs/guide.md"
Changelog = "https://github.com/dlogvinenko/mainspring/blob/main/CHANGELOG.md"
Issues = "https://github.com/dlogvinenko/mainspring/issues"

[project.optional-dependencies]
providers = [
  "litellm>=1.83.11,<2; python_version < '3.14'",
  "filelock>=4.2.1,<5; python_version < '3.14'",
  "aiohttp>=3.14.0; python_version < '3.14'",
  "python-dotenv>=1.2.2; python_version < '3.14'",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
  "pip-audit>=2.9,<3",
]

[project.scripts]
mainspring = "mainspring_bootstrap:main"

[tool.setuptools]
package-dir = {"" = "py"}
py-modules = ["cli_runtime", "mainspring_bootstrap"]

[tool.setuptools.data-files]
"share/mainspring" = [
  "mainspring.sh",
  "requirements.txt",
]
"share/mainspring/lib" = [
  "lib/common.sh",
  "lib/cli.sh",
  "lib/dispatch.sh",
  "lib/doctor.sh",
  "lib/dry_run.sh",
  "lib/engines.sh",
