  "lib/review.sh",
  "lib/self_test.sh",
  "lib/status.sh",
  "lib/taskmaster_helpers.sh",
  "lib/team.sh",
  "lib/usage.sh",
  "lib/wave.sh",
  "lib/wave_loop.sh",
  "lib/wave_loop_setup.sh",
  "lib/wave_loop_state.sh",
  "lib/work_mode_help.sh",
  "lib/write_scope.sh",
  "lib/wizard.sh",
