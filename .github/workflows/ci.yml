# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-all:
    name: make all (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system test tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install system test tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install bats-core shellcheck

      - name: Install Python test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run local CI gate
        run: make all

  lock-protocol:
    name: lock protocol (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: native
          - os: macos-latest
            backend: fcntl
    env:
      MAINSPRING_LOCK_TEST_BACKEND: ${{ matrix.backend }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: py

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install focused test tool
        run: python -m pip install pytest

      - name: Require and log actual selected backend
        run: python -B py/tests/lock_protocol_support.py

      - name: Run owned-temporary protocol and stderr controls
        run: python -B -m pytest -q -rA -s -c /dev/null -p no:cacheprovider py/tests/test_lock_protocol.py
